<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <script src="js/guard.js?v=2"></script>
  <noscript><meta http-equiv="refresh" content="0;url=login.html"></noscript>
  <title>HSBC | Pay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=15" />
</head>
<body>
  <div class="app">
    <div class="page">
      <div class="subhead">
        <div class="subhead-row">
          <a class="back" href="overview.html" aria-label="Back">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
          </a>
          <h1>Pay</h1>
        </div>
      </div>
      <form class="form form-grid" id="payForm">
        <div class="notice">Pay a beneficiary from Mediterranean Investment Capital Ltd · USD.</div>
        <div class="field"><label for="payName">Beneficiary</label><input id="payName" name="name" required autocomplete="organization" placeholder="Company or person" /></div>
        <div class="field"><label for="payIban">Account number</label><input id="payIban" name="iban" required autocomplete="off" spellcheck="false" inputmode="numeric" placeholder="Account number" /></div>
        <div class="field"><label for="payAmount">Amount (USD)</label><input id="payAmount" name="amount" required inputmode="decimal" placeholder="0.00" /></div>
        <div class="field"><label for="payRef">Reference</label><input id="payRef" name="ref" placeholder="Invoice or payment reference" /></div>
        <button class="primary" type="submit" disabled>Continue</button>
      </form>
    </div>
    <div class="modal" id="payFailModal">
      <div class="sheet fail-sheet">
        <div class="fail-icon" aria-hidden="true">
          <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" x2="12" y1="8" y2="12"/>
            <line x1="12" x2="12.01" y1="16" y2="16"/>
          </svg>
        </div>
        <h2 id="payFailTitle">Unable to transfer</h2>
        <p>This payment could not be completed. Please try again later or contact HSBC Bank USA.</p>
        <button class="primary" type="button" id="payFailClose">OK</button>
      </div>
    </div>
  </div>
  <script src="js/app.js?v=15"></script>
</body>
</html>
