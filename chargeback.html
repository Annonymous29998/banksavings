<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <script src="guard.js?v=6"></script>
  <noscript><meta http-equiv="refresh" content="0;url=login.html"></noscript>
  <title>HSBC | Chargeback</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=24" />
</head>
<body>
  <div class="app">
    <div class="page">
      <div class="subhead">
        <div class="subhead-row">
          <a class="back" href="overview.html" aria-label="Back">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
          </a>
          <h1>Chargeback Request</h1>
        </div>
      </div>
      <form class="form form-grid" id="cbForm">
        <div class="notice">Chargebacks can only be requested for debit transactions. Incoming credits cannot be disputed.</div>
        <div class="field">
          <label for="cbSelect">Transaction</label>
          <select name="tx" id="cbSelect" required></select>
        </div>
        <div class="field">
          <label for="cbReason">Reason</label>
          <select id="cbReason" name="reason" required>
            <option value="">Select a reason</option>
            <option>Unauthorized payment</option>
            <option>Duplicate charge</option>
            <option>Goods / services not received</option>
            <option>Incorrect amount</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field"><label for="cbDetails">Details</label><textarea id="cbDetails" name="details" placeholder="Describe the dispute"></textarea></div>
        <button class="primary" type="submit" disabled>Submit request</button>
      </form>
    </div>
    <div class="modal" id="cbFailModal">
      <div class="sheet fail-sheet">
        <div class="fail-icon" aria-hidden="true">
          <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" x2="12" y1="8" y2="12"/>
            <line x1="12" x2="12.01" y1="16" y2="16"/>
          </svg>
        </div>
        <h2 id="cbFailTitle">Unable to complete chargeback</h2>
        <p>This chargeback could not be completed. Please try again later or contact HSBC Bank USA.</p>
        <button class="primary" type="button" id="cbFailClose">OK</button>
      </div>
    </div>
  </div>
  <script src="app.js?v=46"></script>
</body>
</html>
