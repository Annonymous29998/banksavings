<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <script src="js/guard.js?v=1"></script>
  <noscript><meta http-equiv="refresh" content="0;url=login.html"></noscript>
  <title>HSBC | Statement</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=7" />
</head>
<body>
  <div class="app">
    <div class="page">
      <div class="subhead">
        <div class="subhead-row">
          <a class="back" href="overview.html" aria-label="Back">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
          </a>
          <h1>Statement</h1>
        </div>
      </div>
      <form class="form form-grid" id="statementForm">
        <div class="notice">Export a CSV statement for your Business Checking account (USD).</div>
        <div class="field"><label for="stmtFrom">From</label><input id="stmtFrom" type="date" name="from" required value="2020-01-01" /></div>
        <div class="field"><label for="stmtTo">To</label><input id="stmtTo" type="date" name="to" required value="2026-08-31" /></div>
        <div class="field">
          <label for="stmtFormat">Format</label>
          <select id="stmtFormat" name="format"><option value="csv">CSV</option></select>
        </div>
        <button class="primary" type="submit" disabled>Download statement</button>
      </form>
    </div>
  </div>
  <script src="js/app.js?v=9"></script>
</body>
</html>
